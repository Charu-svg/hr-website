<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrenfield admin</title>
<style>
  :root {
    --navy: #131a26;
    --cyan: #14ace8;
    --line: #e7e9ee;
    --light: #f8f8f8;
    --text: #4c5158;
    --muted: #6e7178;
    --green: #23a06a;
    --red: #d2453d;
    --amber: #d98a12;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--light);
    color: var(--text);
    font-family: "Montserrat", "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }

  h1, h2, h3 { color: var(--navy); margin: 0; line-height: 1.25; }
  h1 { font-size: 22px; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; }
  a { color: #0a7ba8; }

  .bar {
    background: var(--navy);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .bar h1 { color: #fff; }
  .bar .spacer { margin-left: auto; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px; }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }

  .count {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }

  .count b { display: block; font-size: 26px; color: var(--navy); line-height: 1.1; }
  .count span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }

  .tab {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 8px 16px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }

  .tab[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }

  .scroll { overflow-x: auto; }

  .tag {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    background: #e8f7fd;
    color: #0a7ba8;
  }

  .tag--off { background: #f1f2f4; color: var(--muted); }
  .tag--warn { background: #fdf3e3; color: var(--amber); }

  button.act, a.act {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    color: var(--navy);
    text-decoration: none;
    display: inline-block;
  }

  button.act:hover, a.act:hover { border-color: var(--navy); }
  button.danger { color: var(--red); border-color: #f3d5d3; }
  button.danger:hover { border-color: var(--red); }

  .muted { color: var(--muted); font-size: 13px; }
  .nowrap { white-space: nowrap; }

  input[type="password"], input[type="text"] {
    font: inherit;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    min-width: 260px;
  }

  button.primary {
    font: inherit;
    font-weight: 600;
    background: var(--cyan);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 10px 18px;
    cursor: pointer;
  }

  .status { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
  .status--error { background: #fdeceb; color: var(--red); }
  .status--ok { background: #e7f6ef; color: var(--green); }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ellipsis { max-width: 340px; }
  .kv { font-size: 13px; }
  .kv dt { font-weight: 700; color: var(--navy); margin-top: 6px; }
  .kv dd { margin: 0; }
</style>
</head>
<body>
  <div class="bar">
    <h1>Wrenfield admin</h1>
    <span class="spacer"></span>
    <span class="muted" id="who" style="color: rgba(255,255,255,.75)"></span>
    <button class="act" type="button" id="signout" hidden>Sign out</button>
  </div>

  <div class="wrap">
    <div id="gate" class="card" hidden>
      <h2>Admin token</h2>
      <p class="muted">
        This is the value you set as <code>ADMIN_TOKEN</code> in your <code>.env</code> file. It is
        kept in this browser tab only and never written to disk.
      </p>
      <div class="flex" style="margin-top: 12px">
        <input type="password" id="token" placeholder="Paste your admin token" autocomplete="current-password">
        <button class="primary" type="button" id="signin">Open</button>
      </div>
      <div id="gate-error"></div>
    </div>

    <div id="panel" hidden>
      <div id="notice"></div>
      <div class="counts" id="counts"></div>

      <div class="tabs" role="tablist" id="tabs" style="margin-top: 20px">
        <button class="tab" type="button" role="tab" data-view="briefs" aria-selected="true">Briefs</button>
        <button class="tab" type="button" role="tab" data-view="applications" aria-selected="false">Applications</button>
        <button class="tab" type="button" role="tab" data-view="subscribers" aria-selected="false">Subscribers</button>
        <button class="tab" type="button" role="tab" data-view="roles" aria-selected="false">Roles</button>
      </div>

      <div class="card">
        <div class="scroll" id="view"></div>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var token = sessionStorage.getItem("wrenfield.admin") || "";
  var currentView = "briefs";

  var els = {
    gate: document.getElementById("gate"),
    panel: document.getElementById("panel"),
    token: document.getElementById("token"),
    signin: document.getElementById("signin"),
    signout: document.getElementById("signout"),
    gateError: document.getElementById("gate-error"),
    notice: document.getElementById("notice"),
    counts: document.getElementById("counts"),
    view: document.getElementById("view"),
    tabs: document.getElementById("tabs"),
    who: document.getElementById("who")
  };

  function api(path, options) {
    var opts = options || {};
    opts.headers = Object.assign({ authorization: "Bearer " + token }, opts.headers || {});
    return fetch(path, opts).then(function (response) {
      return response.json().then(function (body) {
        if (!response.ok) {
          var error = new Error(body.error || "Request failed");
          error.status = response.status;
          throw error;
        }
        return body;
      });
    });
  }

  function notice(kind, message) {
    els.notice.innerHTML = message
      ? '<div class="status status--' + kind + '">' + escapeHtml(message) + "</div>"
      : "";
  }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? "" : value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function when(value) {
    if (!value) return "";
    var date = new Date(value);
    return date.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) +
      " " + date.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }

  function money(value) {
    if (value === null || value === undefined) return "";
    return "£" + Number(value).toLocaleString("en-GB");
  }

  function show(view) {
    currentView = view;

    Array.prototype.forEach.call(els.tabs.querySelectorAll("[data-view]"), function (tab) {
      tab.setAttribute("aria-selected", tab.getAttribute("data-view") === view ? "true" : "false");
    });

    els.view.innerHTML = '<p class="empty">Loading…</p>';

    api("/api/admin/" + view)
      .then(function (body) {
        if (view === "briefs") renderBriefs(body.rows);
        else if (view === "applications") renderApplications(body.rows);
        else if (view === "subscribers") renderSubscribers(body.rows);
        else renderRoles(body.rows);
      })
      .catch(function (error) {
        if (error.status === 401 || error.status === 503) return lock(error.message);
        els.view.innerHTML = '<p class="empty">' + escapeHtml(error.message) + "</p>";
      });
  }

  function renderBriefs(rows) {
    if (!rows.length) {
      els.view.innerHTML = '<p class="empty">No briefs yet. They will appear here the moment one arrives.</p>';
      return;
    }

    els.view.innerHTML =
      "<table><thead><tr><th>Received</th><th>Role</th><th>Company</th><th>Desk</th><th>Band</th><th>Contact</th><th>Brief</th><th></th></tr></thead><tbody>" +
      rows.map(function (row) {
        return "<tr>" +
          '<td class="nowrap">' + when(row.created_at) + "</td>" +
          "<td><strong>" + escapeHtml(row.role_title) + "</strong><br><span class=\"muted\">" + escapeHtml(row.location) + " · " + escapeHtml(row.contract || "") + "</span></td>" +
          "<td>" + escapeHtml(row.company) + "</td>" +
          '<td><span class="tag">' + escapeHtml(row.desk) + "</span></td>" +
          '<td class="nowrap">' + money(row.band_min) + "<br>" + money(row.band_max) + "</td>" +
          "<td>" + escapeHtml(row.name) + '<br><a href="mailto:' + escapeHtml(row.email) + '">' + escapeHtml(row.email) + "</a><br><span class=\"muted\">" + escapeHtml(row.phone || "") + "</span></td>" +
          '<td class="ellipsis kv"><dt>What the last person got wrong</dt><dd>' + escapeHtml(row.failed) + "</dd>" +
          (row.tried ? "<dt>Tried already</dt><dd>" + escapeHtml(row.tried) + "</dd>" : "") + "</td>" +
          '<td><button class="act danger" type="button" data-delete="briefs" data-id="' + row.id + '">Delete</button></td>' +
          "</tr>";
      }).join("") +
      "</tbody></table>";
  }

  function renderApplications(rows) {
    if (!rows.length) {
      els.view.innerHTML = '<p class="empty">No applications yet.</p>';
      return;
    }

    els.view.innerHTML =
      "<table><thead><tr><th>Received</th><th>Candidate</th><th>Role</th><th>Note</th><th>CV</th><th></th></tr></thead><tbody>" +
      rows.map(function (row) {
        return "<tr>" +
          '<td class="nowrap">' + when(row.created_at) + "</td>" +
          "<td><strong>" + escapeHtml(row.name) + "</strong><br><a href=\"mailto:" + escapeHtml(row.email) + '">' + escapeHtml(row.email) + "</a><br><span class=\"muted\">" + escapeHtml(row.phone || "") + "</span></td>" +
          "<td>" + escapeHtml(row.role_title || "Not specified") + '<br><span class="muted">' + escapeHtml(row.role_ref || "") + "</span></td>" +
          '<td class="ellipsis">' + escapeHtml(row.note || "") + "</td>" +
          "<td>" + (row.cv_path
            ? '<a class="act" href="/api/admin/cv/' + row.id + '" download>Download</a><br><span class="muted">' + Math.round((row.cv_size || 0) / 1024) + "KB</span>"
            : '<span class="muted">none</span>') + "</td>" +
          '<td><button class="act danger" type="button" data-delete="applications" data-id="' + row.id + '">Delete</button></td>' +
          "</tr>";
      }).join("") +
      "</tbody></table>";
  }

  function renderSubscribers(rows) {
    if (!rows.length) {
      els.view.innerHTML = '<p class="empty">Nobody has signed up yet.</p>';
      return;
    }

    els.view.innerHTML =
      "<table><thead><tr><th>Joined</th><th>Email</th><th>Source</th><th></th></tr></thead><tbody>" +
      rows.map(function (row) {
        return "<tr>" +
          '<td class="nowrap">' + when(row.created_at) + "</td>" +
          '<td><a href="mailto:' + escapeHtml(row.email) + '">' + escapeHtml(row.email) + "</a></td>" +
          '<td><span class="tag">' + escapeHtml(row.source || "site") + "</span></td>" +
          '<td><button class="act danger" type="button" data-delete="subscribers" data-id="' + row.id + '">Delete</button></td>' +
          "</tr>";
      }).join("") +
      "</tbody></table>";
  }

  function renderRoles(rows) {
    els.view.innerHTML =
      '<p class="muted" style="margin-top:0">Unpublishing a role removes it from the public board straight away. Everything else about the role stays as it is.</p>' +
      "<table><thead><tr><th>Ref</th><th>Role</th><th>Desk</th><th>Location</th><th>Band</th><th>Stage</th><th>Open</th><th>On the board</th><th></th></tr></thead><tbody>" +
      rows.map(function (row) {
        return "<tr>" +
          '<td class="nowrap"><strong>' + escapeHtml(row.ref) + "</strong></td>" +
          "<td>" + escapeHtml(row.title) + "</td>" +
          '<td><span class="tag">' + escapeHtml(row.deskName || row.desk) + "</span></td>" +
          "<td>" + escapeHtml(row.location) + "</td>" +
          '<td class="nowrap">' + escapeHtml(row.band || "Not set") + "</td>" +
          "<td>" + escapeHtml(row.stageLabel || row.stage) + "</td>" +
          '<td class="nowrap">' + escapeHtml(row.daysOpen) + " days</td>" +
          "<td>" + (row.published
            ? '<span class="tag">Live</span>'
            : '<span class="tag tag--off">Hidden</span>') + "</td>" +
          '<td class="nowrap"><button class="act" type="button" data-publish="' + escapeHtml(row.ref) + '" data-value="' + (row.published ? "false" : "true") + '">' +
          (row.published ? "Unpublish" : "Publish") + "</button></td>" +
          "</tr>";
      }).join("") +
      "</tbody></table>";
  }

  function loadCounts() {
    return api("/api/admin/summary").then(function (body) {
      els.counts.innerHTML = [
        ["Briefs", body.counts.briefs],
        ["Applications", body.counts.applications],
        ["Subscribers", body.counts.subscribers],
        ["Roles live", body.counts.roles]
      ].map(function (pair) {
        return '<div class="count"><b>' + pair[1] + "</b><span>" + pair[0] + "</span></div>";
      }).join("");

      els.who.textContent = "Retention " + body.retentionDays + " days · " +
        (body.mailEnabled ? "email on" : "email off") + " · " +
        (body.webhookEnabled ? "webhook on" : "webhook off");
    });
  }

  function unlock() {
    els.gate.hidden = true;
    els.panel.hidden = false;
    els.signout.hidden = false;
    loadCounts().catch(function () {});
    show(currentView);
  }

  function lock(message) {
    token = "";
    sessionStorage.removeItem("wrenfield.admin");
    els.panel.hidden = true;
    els.signout.hidden = true;
    els.gate.hidden = false;
    els.gateError.innerHTML = message
      ? '<div class="status status--error" style="margin-top:12px">' + escapeHtml(message) + "</div>"
      : "";
  }

  els.signin.addEventListener("click", function () {
    token = els.token.value.trim();
    if (!token) return;
    sessionStorage.setItem("wrenfield.admin", token);

    api("/api/admin/summary")
      .then(unlock)
      .catch(function (error) {
        lock(error.message);
      });
  });

  els.token.addEventListener("keydown", function (event) {
    if (event.key === "Enter") els.signin.click();
  });

  els.signout.addEventListener("click", function () {
    lock("");
    els.gateError.innerHTML = "";
  });

  els.tabs.addEventListener("click", function (event) {
    var tab = event.target.closest("[data-view]");
    if (tab) show(tab.getAttribute("data-view"));
  });

  els.view.addEventListener("click", function (event) {
    var remove = event.target.closest("[data-delete]");
    if (remove) {
      var table = remove.getAttribute("data-delete");
      var id = remove.getAttribute("data-id");
      if (!window.confirm("Delete this record for good? This cannot be undone.")) return;

      api("/api/admin/" + table + "/" + id, { method: "DELETE" })
        .then(function () {
          notice("ok", "Deleted.");
          loadCounts().catch(function () {});
          show(currentView);
        })
        .catch(function (error) {
          notice("error", error.message);
        });
      return;
    }

    var publish = event.target.closest("[data-publish]");
    if (publish) {
      var ref = publish.getAttribute("data-publish");
      var value = publish.getAttribute("data-value") === "true";

      api("/api/admin/roles/" + ref, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ published: value })
      })
        .then(function () {
          notice("ok", ref + (value ? " is back on the board." : " is hidden from the board."));
          loadCounts().catch(function () {});
          show("roles");
        })
        .catch(function (error) {
          notice("error", error.message);
        });
    }
  });

  if (token) {
    api("/api/admin/summary")
      .then(unlock)
      .catch(function (error) {
        lock(error.status === 401 ? error.message : "");
      });
  } else {
    lock("");
  }
})();
</script>
</body>
</html>
